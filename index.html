<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全国硕士研究生招生考试初试成绩查询系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; background-color: #f5f5f5; }
        .tab-active { background-color: #0c4284; color: white; }
        .tab-inactive { background-color: #9cb1ce; color: #333; }
        .result-bg { background-color: #f0f2f5; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 20px 20px; }
        .score-table th, .score-table td { border-bottom: 1px dashed #ccc; }
        .banner-bg { background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%); position: relative; }
        .grid-wrapper { border-left: 1px solid #e5e7eb; border-top: 1px solid #e5e7eb; }
        .grid-item { border-right: 1px solid #e5e7eb; border-bottom: 1px solid #e5e7eb; cursor: pointer; }
        .grid-item:hover { color: #1890ff; background-color: #f0f7ff; }
    </style>
</head>
<body class="min-h-screen flex flex-col text-gray-800">

    <div id="step1-select" class="flex-grow w-full bg-white">
        <div class="banner-bg w-full py-12 text-center text-white">
            <h1 class="text-[32px] font-bold tracking-wider mb-4">2026年部分考生初试成绩查询</h1>
            <p class="text-sm opacity-90 tracking-wide">本系统所有数据均为招生单位提供，招生单位对查询结果负责解释。</p>
        </div>
        <div class="max-w-[1200px] mx-auto px-4 py-8">
            <div class="bg-[#fafafa] p-6 border border-gray-100 flex flex-wrap gap-x-6 gap-y-4 text-[14px] text-gray-600">
                <span class="bg-[#1890ff] text-white px-2 py-0.5 rounded cursor-pointer">河南</span>
                <span class="cursor-pointer hover:text-blue-600">其他省份...</span>
            </div>
            <div class="mt-6 border border-gray-200 bg-white">
                <div class="p-4 border-b border-gray-200 text-lg font-bold">
                    <span class="text-[#1890ff]">河南</span> <span class="text-gray-700">成绩查询</span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 text-[14px] text-black grid-wrapper">
                    <div class="p-5 grid-item" onclick="goToStep2()">(10459)郑州大学</div>
                    <div class="p-5 grid-item" onclick="goToStep2()">(10462)郑州轻工业大学</div>
                    <div class="p-5 grid-item" onclick="goToStep2()">(10475)河南大学</div>
                    <div class="p-5 grid-item" onclick="goToStep2()">(10476)河南师范大学</div>
                </div>
            </div>
        </div>
    </div>

    <div id="step2-form" class="hidden flex-grow bg-white shadow-sm pb-16">
        <div class="max-w-[1200px] mx-auto">
            <div class="flex border-b-4 border-[#0c4284] bg-gray-100 pl-4 mt-10">
                <div class="px-8 py-3 tab-active cursor-pointer font-medium rounded-t-sm">成绩查询</div>
            </div>
            <div class="mt-16 max-w-2xl mx-auto px-4">
                <h1 class="text-2xl font-bold text-center mb-10 tracking-widest text-gray-800">硕士研究生初试成绩查询</h1>
                <form onsubmit="goToStep3(event)" class="space-y-6">
                    <div class="flex items-center justify-center">
                        <label class="w-24 text-right pr-4 text-gray-600 text-sm">姓名：</label>
                        <input type="text" id="studentName" class="border border-gray-300 px-3 py-1.5 w-72 focus:outline-none focus:border-blue-500 shadow-sm" placeholder="可不填">
                    </div>
                    <div class="flex items-center justify-center">
                        <label class="w-24 text-right pr-4 text-gray-600 text-sm">考生编号：</label>
                        <input type="text" id="studentId" class="border border-gray-300 px-3 py-1.5 w-72 focus:outline-none focus:border-blue-500 shadow-sm" placeholder="可不填">
                    </div>
                    <div class="flex justify-center space-x-6 pt-6">
                        <button type="submit" class="bg-[#0c4284] text-white px-8 py-1.5 text-sm cursor-pointer hover:bg-blue-800 transition">查询</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="step3-result" class="hidden flex-grow justify-center items-start pt-10 pb-20 result-bg">
        <div class="w-full max-w-4xl bg-white shadow-lg p-12 border border-gray-200 relative min-h-[500px]">
            <h3 class="text-lg font-bold mb-8 text-gray-800">初试科目及成绩：</h3>
            <table class="w-full score-table mb-12 text-gray-700 text-[15px]">
                <thead>
                    <tr>
                        <th class="text-left font-normal py-4 px-12 w-2/3">科目代码及名称</th>
                        <th class="text-center font-normal py-4 w-1/3">成绩</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td class="py-5 px-12">[101] 思想政治理论</td><td class="text-center" id="score-101">--</td></tr>
                    <tr><td class="py-5 px-12">[204] 英语（二）</td><td class="text-center" id="score-204">--</td></tr>
                    <tr><td class="py-5 px-12">[302] 数学（二）</td><td class="text-center" id="score-302">--</td></tr>
                    <tr><td class="py-5 px-12">[911] 心理健康教育</td><td class="text-center" id="score-911">--</td></tr>
                    <tr><td class="py-5 px-12 font-bold text-black">总分</td><td class="text-center font-bold text-red-600" id="score-total">--</td></tr>
                </tbody>
            </table>
            <div class="mt-16 flex flex-col items-center">
                <div id="qrcode" class="border p-1 bg-white min-w-[90px] min-h-[90px] flex items-center justify-center"></div>
                <div class="text-[10px] text-gray-400 mt-1">扫码核实成绩信息</div>
            </div>
            <div class="absolute top-6 right-6">
                <button onclick="goBack()" class="px-4 py-2 border border-gray-300 rounded text-sm bg-white text-gray-600 hover:bg-gray-100 cursor-pointer shadow-sm">返回重新查询</button>
            </div>
        </div>
    </div>

    <script>
        const step1 = document.getElementById('step1-select');
        const step2 = document.getElementById('step2-form');
        const step3 = document.getElementById('step3-result');

        function goToStep2() {
            step1.classList.add('hidden');
            step2.classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function goToStep3(event) {
            event.preventDefault(); 
            
            const name = document.getElementById('studentName').value || "张三";
            const id = document.getElementById('studentId').value || "104761234567";
            
            // 随机生成分数（原作者的娱乐设定）
            const s101 = Math.floor(Math.random() * 101); 
            const s204 = Math.floor(Math.random() * 101); 
            const s302 = Math.floor(Math.random() * 151); 
            const s911 = Math.floor(Math.random() * 151); 
            const total = s101 + s204 + s302 + s911;

            document.getElementById('score-101').innerText = s101;
            document.getElementById('score-204').innerText = s204;
            document.getElementById('score-302').innerText = s302;
            document.getElementById('score-911').innerText = s911;
            document.getElementById('score-total').innerText = total;
            
            const qrText = `【官方核实】姓名：${name} 总分：${total}`;
            const qrUrl = `https://quickchart.io/qr?text=${encodeURIComponent(qrText)}&size=90`;
            
            document.getElementById('qrcode').innerHTML = `<img src="${qrUrl}" width="90" height="90" alt="扫码">`;
            
            step2.classList.add('hidden');
            step3.classList.remove('hidden');
            step3.classList.add('flex');
            window.scrollTo(0,0);
        }
        
        function goBack() { location.reload(); }
    </script>
</body>
</html>
