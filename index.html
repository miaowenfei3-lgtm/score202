<script>
    Vue.component('watermark', {
        props: {
            targetElement: {
                type: String,
                default: ''
            },
            watermarkText: {
                type: String,
                default: '中国研究生招生信息网'
            },
            fontSize: {
                type: Number,
                default: 22
            },
            color: {
                type: String,
                default: 'rgba(200, 200, 200, 0.4)'
            },
            rotate: {
                type: Number,
                default: -20
            },
            watermarkWidth: {
                type: Number,
                default: 170
            },
            watermarkHeight: {
                type: Number,
                default: 102
            },
            spacing: {
                type: Number,
                default: 0
            },
            overflow: {
                type: String,
                default: 'scale'
            }
        },
        data: function() {
            return {
                isFullscreen: false,
                watermarkObserver: null,
                watermarkDom: null,
                resizeHandler: null,
                targetElementObserver: null,
                resizeObserver: null
            };
        },
        mounted: function() {
            this.initWatermark();
            // 绑定resize处理函数（ES5兼容）
            this.resizeHandler = function() {
                this.handleResize();
            }.bind(this);
            window.addEventListener('resize', this.resizeHandler);
        },
        beforeDestroy: function() {
            this.destroyWatermark();
            if (this.resizeHandler) {
                window.removeEventListener('resize', this.resizeHandler);
                this.resizeHandler = null;
            }
        },
        methods: {
            // 初始化水印
            initWatermark: function() {
                var _this = this;

                // 创建水印DOM节点
                this.createWatermarkDom();

                // 判断是否全屏覆盖
                if (!this.targetElement) {
                    this.isFullscreen = true;
                    this.watermarkDom.className = 'watermark-container watermark-container-fullscreen';
                    document.body.appendChild(this.watermarkDom);
                } else {
                    var target = document.querySelector(this.targetElement);
                    if (target) {
                        // 设置目标元素为相对定位
                        if (window.getComputedStyle(target).position === 'static') {
                            target.style.position = 'relative';
                        }
                        this.watermarkDom.className = 'watermark-container';
                        target.appendChild(this.watermarkDom);
                        // 监听目标元素尺寸变化
                        this.observeTargetElementSize(target);
                    } else {
                        // 目标元素不存在，默认全屏覆盖
                        this.isFullscreen = true;
                        this.watermarkDom.className = 'watermark-container watermark-container-fullscreen';
                        document.body.appendChild(this.watermarkDom);
                    }
                }

                this.generateWatermark();
                this.observeWatermark();
            },

            // 创建水印DOM节点
            createWatermarkDom: function() {
                if (this.watermarkDom) {
                    this.destroyWatermark();
                }
                this.watermarkDom = document.createElement('div');
            },

            // 生成水印（核心逻辑）
            generateWatermark: function() {
                var canvas = document.createElement("canvas");
                var ctx = canvas.getContext("2d");
                var rotateRad = Math.abs(this.rotate * Math.PI / 180);
                var sin = Math.sin(rotateRad);
                var cos = Math.cos(rotateRad);

                // 计算旋转后尺寸
                var rotatedWidth = Math.ceil(this.watermarkWidth * cos + this.watermarkHeight * sin);
                var rotatedHeight = Math.ceil(this.watermarkWidth * sin + this.watermarkHeight * cos);
                var canvasWidth = rotatedWidth + this.spacing;
                var canvasHeight = rotatedHeight + this.spacing;

                canvas.width = canvasWidth;
                canvas.height = canvasHeight;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 设置文字样式（ES5字符串拼接）
                ctx.font = this.fontSize + "px Arial, Microsoft YaHei";
                ctx.fillStyle = this.color;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                // 绘制水印文字
                ctx.save();
                ctx.translate(canvasWidth / 2, canvasHeight / 2);
                ctx.rotate((this.rotate * Math.PI) / 180);

                // 处理文字超长情况
                var maxWidth = this.watermarkWidth - 20;
                if (this.overflow === 'wrap') {
                    this.drawWrappedText(ctx, this.watermarkText, 0, 0, maxWidth, this.fontSize * 1.2);
                } else if (this.overflow === 'scale') {
                    this.drawScaledText(ctx, this.watermarkText, 0, 0, maxWidth);
                } else {
                    this.drawTruncatedText(ctx, this.watermarkText, 0, 0, maxWidth);
                }

                ctx.restore();

                // 应用水印背景（ES5字符串拼接）
                var watermarkBase64 = canvas.toDataURL("image/png");
                this.watermarkDom.style.backgroundImage = "url(" + watermarkBase64 + ")";
                this.watermarkDom.style.backgroundRepeat = "repeat";
                this.watermarkDom.style.backgroundPosition = "0 0";
                this.watermarkDom.style.backgroundSize = canvasWidth + "px " + canvasHeight + "px";
            },

            // 绘制自动换行文字（纯ES5）
            drawWrappedText: function(ctx, text, x, y, maxWidth, lineHeight) {
                var words = text.split('');
                var line = '';
                var lines = [];
                var i, testLine, metrics, testWidth;

                // 逐字添加并检查宽度
                for (i = 0; i < words.length; i++) {
                    testLine = line + words[i];
                    metrics = ctx.measureText(testLine);
                    testWidth = metrics.width;

                    if (testWidth > maxWidth && i > 0) {
                        lines.push(line);
                        line = words[i];
                    } else {
                        line = testLine;
                    }
                }
                lines.push(line);

                // 计算总高度并居中绘制
                var totalHeight = lines.length * lineHeight;
                var startY = y - totalHeight / 2;
                var j;

                    ctx.save();
                    ctx.scale(scaleFactor, scaleFactor);
                    ctx.fillText(text, x / scaleFactor, y / scaleFactor);
                    ctx.restore();
                } else {
                    ctx.fillText(text, x, y);
                }
            },

            drawTruncatedText: function(ctx, text, x, y, maxWidth) {
                var metrics = ctx.measureText(text);

                }

                            // 检查水印是否被删除
                            if (mutation.type === 'childList') {
                                [].forEach.call(mutation.removedNodes, function(node) {
                                    if (node === _this.watermarkDom) {
                                        isWatermarkRemoved = true;
                                    }
                                });
                            }

                            // 检查水印是否被隐藏
                            if (mutation.type === 'attributes' && mutation.target === _this.watermarkDom) {
                                if (_this.watermarkDom.style.display === 'none' || _this.watermarkDom.style.visibility === 'hidden') {

                    var observerTarget = _this.isFullscreen ? document.body : _this.watermarkDom.parentElement;

                    if (window.MutationObserver) {

                        });
                    }
                }
            },

            handleResize: function() {
                this.generateWatermark();
            },

            // 销毁水印（清理所有资源）
            destroyWatermark: function() {
                // 断开所有观察者
                if (this.watermarkObserver) {
                    this.watermarkObserver.disconnect();
                    this.watermarkObserver = null;
                }
                if (this.targetElementObserver) {
                    this.targetElementObserver.disconnect();
                    this.targetElementObserver = null;
                }
                if (this.resizeObserver) {
                    this.resizeObserver.disconnect();
                    this.resizeObserver = null;
                }

                // 移除DOM节点
                if (this.watermarkDom && this.watermarkDom.parentNode) {
                    this.watermarkDom.parentNode.removeChild(this.watermarkDom);
                    this.watermarkDom = null;

            findMatchingNavItem: function(list, title) {
                var _this = this;
                for (var i = 0, len = list.length; i < len; i++) {
                    var item = list[i];
                    if (item.name === title || item.fullName === title) return item;

                    if (item.child && item.child.length) {
                        var foundChild = _this.findMatchingNavItem(item.child, title);
                        if (foundChild) return foundChild;
                    }
                }
                return null;
            }
        },

                var str = this.secondTitle;
                if (str) {
                    var found = this.findMatchingNavItem(this.navList, str);
                    if (found) {
                        str = '<a href="' + (this.isWap ? found.wapHref : found.href) + '">' + (found.fullName || found.name) + '</a>';
                    }
                }
                return str;

                }
            },
        },
        template: '#nav-bar-template'

    <script type="text/javascript">
        // 获取url中参数方法
        function getUrlString(name) {
            var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
            var r = window.location.search.substr(1).match(reg);
            if (r != null) return decodeURIComponent(r[2]); return null;
        }
        api.errorCallback = function (code, msg) {
            // 当其他错误发生时，弹出提示层
            setTimeout(function () {
                vmMain.$dialog.alert({
                    title: '提示',
                    message: msg,
                    confirmButtonText: '确定'
                }).then(function() {
                    vmMain.$dialog.close();
                });;
            }, 500);
        };
        vant.Dialog.setDefaultOptions({
            confirmButtonText: '确定'
        });
        var vmMain = new Vue({
            el: '#app',
            mixins: typeof mixin != 'undefined' ? [mixin] : {},
            data: function () {
                return {
                    str: '',
                    prefix: 'yzwb_',
                    formErrors: [],
                    hidebar: false, //隐藏吊顶 true 隐藏， false 展示
                    iframed: false //页面是否被iframe
                }
            },
            methods: {
                judgeIframe: function () {
                    if (self != top) {
                        this.iframed = true;
                    }
                },
                setError: function () {  //页面错误回显
                    for (var i = 0; i < this.formErrors.length; i++) {
                        if (this.formErrors[i].name=='') {
                            this.str += this.formErrors[i].message + '<br>';
                        } else {
                            this.str += this.formErrors[i].message + '<br>';
                            this.errors.add(this.prefix+this.formErrors[i].name,this.formErrors[i].message)
                        }
                    }
                    this.setglogalError();
                },
                setglogalError: function () { //全局错误弹出
                    if(this.str !== ""){
                        this.$dialog.alert({
                            title: '提示',
                            message: this.str,
                            confirmButtonText: '关闭'
                        });
                    }
                },
                removePageLoading: function () {
                    document.getElementById("appLoading").style.display = "none";
                },
                repForm: function () {
                    var _obj = this.$refs['form'].children;
                    for (var i = 0; i < _obj.length; i++) {
                        // _obj[i].value =  repenter(rep(_obj[i].value.trim()));
                        _obj[i].value = _obj[i].value.trim();
                    }
                },
                limitLength: function (value, byteLength, target, title) {
                    var newvalue = value.replace(/[^\x00-\xff]/g, "**"), //匹配双字节字符，计算长度
                        _length = newvalue.length;
                    if (byteLength<_length) {
                        this.errors.add(target,title + "最大输入" + byteLength + "个字节（相当于" + byteLength / 2 + "个汉字）！");
                    }
                },
                changeQuot: function(target,value) { //输入引号自动转化成全角
                    // this[target] = value.replace(/\'/g,"＇").replace(/\"/g,"＂");
                },
                delSpace: function(target,value) { //去除学历和学位的空格
                    this[target] = value.replace(/\s/g,"");
                    this.changeQuot(target,value);
                },
                submit: function () {
                    var _this =this;
                    this.$validator.validateAll().then(function(result){
                        if (result) {
                            _this.repForm();
                            _this.$nextTick().then(function(){
                                if (typeof _this.validateAllMsg === 'function') {
                                    if (_this.validateAllMsg().list.length > 0 ) {
                                        var str = '';
                                        for (var i = 0; i < _this.validateAllMsg().list.length; i++) {
                                            str += _this.validateAllMsg().list[i] + '<br>';
                                        }
                                        if (_this.validateAllMsg().type === '一般') {
                                            _this.$dialog.confirm({
                                                title: '提示',
                                                message: str,
                                                confirmButtonText: '继续提交',
                                                cancelButtonText: '返回修改'
                                            }).then(function(){
                                                _this.$dialog.close();
                                                _this.$refs['form'].submit();
                                            }).catch(function(){
                                                _this.$dialog.close();
                                            });
                                        } else {
                                            _this.$dialog.alert({
                                                title: '错误',
                                                message: str,
                                                confirmButtonText: '返回修改'
                                            }).then(function(){
                                                _this.$dialog.close();
                                            });
                                        }
                                    } else {
                                        _this.$refs['form'].submit();
                                    }
                                } else {
                                    _this.$refs['form'].submit();
                                }
                            });
                        } else {
                            window.scrollTo(0,document.getElementsByName(_this.errors.items[0].field)[0].getBoundingClientRect().top+document.documentElement.scrollTop-20)
                        }
                    })
                }
            },
            mounted: function () {
                this.setError();
                this.judgeIframe();
                if (getUrlString('hidebar') == 'true') {
                    this.hidebar = true;
                }
                var baiduRegex = /swan\//;
                if (baiduRegex.test(navigator.userAgent.toLowerCase())) {
                    this.hidebar = true;
                }
            }
        });
