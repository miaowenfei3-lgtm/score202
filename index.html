<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>全国硕士研究生招生考试初试成绩查询系统</title>
    <link rel="stylesheet" href="https://t1.chei.com.cn/yz/apply/assets2021/mobile/css/app.css?20220923">
    <link rel="stylesheet" href="https://t1.chei.com.cn/yz/zbft/css/wap-common.css">
    <style>
        [v-cloak] { display: none; }
        .yzwb-ksxx { min-height: calc(100vh - 1.5rem); background: #f6f7f9; }
        .header-title { background: #1887E0; color: #fff; padding: 1.5rem 1rem; text-align: center; font-size: 1.1rem; font-weight: bold; }
        .input-group { background: #fff; margin-top: 0.5rem; }
        .btn-box { padding: 1.5rem 1rem; }
        .result-panel { background: #fff; margin-top: 0.5rem; }
        /* 模拟原版表格线样式 */
        .van-field__label { color: #666; }
    </style>
</head>
<body>
    <div id="app" v-cloak>
        <div class="yzwb-ksxx">
            <div class="wap-nav-bar wap-nav-bar-border" style="height: 1.173rem; background: #fff; display: flex; align-items: center; padding: 0 0.427rem;">
                <img src="https://t1.chei.com.cn/yz/wap/assets/images/index/logo.png" alt="研招网" style="width: 2.87rem;">
            </div>

            <div class="header-title">2026年全国硕士研究生招生考试初试成绩查询</div>

            <div v-if="step === 'input'">
                <div class="input-group">
                    <van-cell-group>
                        <van-field v-model="form.xm" label="姓名" placeholder="请输入姓名" required></van-field>
                        <van-field v-model="form.ksbh" label="考生编号" placeholder="请输入15位考生编号" required></van-field>
                    </van-cell-group>
                </div>
                <div class="btn-box">
                    <van-button size="large" type="primary" @click="handleQuery" :loading="loading" loading-text="查询中...">查询</van-button>
                </div>
                <div style="padding: 0 1rem; color: #999; font-size: 0.7rem;">
                    <p>提示：姓名、考生编号为必填项。</p>
                </div>
            </div>

            <div v-if="step === 'result'">
                <div class="yzwb-notice-bar" style="word-break:break-all; background: #fffbe6; color: #ed6a0c; padding: 0.5rem 1rem; font-size: 0.75rem; border-bottom: 1px solid #ffe58f;">
                    招生单位说明：对初试成绩有异议的考生请按招生单位官网通知申请复核。
                </div>

                <div class="result-panel">
                    <van-cell-group>
                        <van-field label="姓名" :value="form.xm" readonly disabled></van-field>
                        <van-field label="考生编号" :value="form.ksbh" readonly disabled></van-field>
                        <van-field label="总分" :value="cj.zf" readonly disabled style="font-weight: bold; color: #f44;"></van-field>
                        <van-field label="第一门" :value="cj.km1" readonly disabled></van-field>
                        <van-field label="第二门" :value="cj.km2" readonly disabled></van-field>
                        <van-field label="第三门" :value="cj.km3" readonly disabled></van-field>
                        <van-field label="第四门" :value="cj.km4" readonly disabled></van-field>
                        <van-field label="备注" value="无" readonly disabled></van-field>
                    </van-cell-group>
                </div>

                <div class="btn-box">
                    <van-button size="large" plain type="primary" @click="step = 'input'">返回重新查询</van-button>
                </div>
            </div>
            
            <div class="wap-footer" style="padding: 1rem 0; text-align: center; color: #999; font-size: 0.65rem;">
                主办单位：教育部学生服务与素质发展中心<br>
                Copyright © 2003-2026 学信网 All Rights Reserved
            </div>
        </div>
    </div>

    <script src="https://t2.chei.com.cn/common/js/vue/2.5.15/vue.min.js"></script>
    <script src="https://t1.chei.com.cn/common/js/vue-plugins/vant.min.js"></script>

    <script>
        new Vue({
            el: '#app',
            data: {
                step: 'input', // 初始阶段为输入
                loading: false,
                form: {
                    xm: '',
                    ksbh: ''
                },
                // 此处配置您想展示的分数数据
                cj: {
                    zf: "425",
                    km1: "(101)思想政治理论：82",
                    km2: "(201)英语（一）：78",
                    km3: "(301)数学（一）：135",
                    km4: "(801)专业课：130"
                }
            },
            methods: {
                handleQuery: function() {
                    if (!this.form.xm || !this.form.ksbh) {
                        this.$dialog.alert({ message: '请完整填写姓名和考生编号' });
                        return;
                    }
                    this.loading = true;
                    // 模拟查询延迟
                    setTimeout(() => {
                        this.loading = false;
                        this.step = 'result';
                        window.scrollTo(0, 0);
                    }, 800);
                }
            }
        });
    </script>
</body>
</html>
