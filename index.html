<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全国硕士研究生招生考试部分考生初试成绩查询系统</title>
    <style>
        /* 页面基础排版 */
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f7f9fa; color: #333; }
        .header { background-color: #1887e0; color: #fff; text-align: center; padding: 18px 0; font-size: 19px; font-weight: 500; }
        .alert-box { background-color: #fcfcfc; border-bottom: 1px solid #eee; padding: 15px; font-size: 14px; color: #666; line-height: 1.6; }
        
        /* 成绩列表框 */
        .info-list { background-color: #fff; margin-top: 10px; border-top: 1px solid #eee; }
        .info-item { display: flex; padding: 18px 15px; border-bottom: 1px solid #f5f5f5; align-items: flex-start; }
        .info-label { width: 100px; color: #333; font-size: 17px; flex-shrink: 0; }
        .info-value { flex: 1; color: #555; font-size: 17px; word-break: break-all; }
        
        /* 底部提示和按钮 */
        .tips { padding: 15px; font-size: 13px; color: #999; line-height: 1.6; }
        .btn-wrap { padding: 20px 15px 40px; }
        .btn { display: block; width: 100%; background-color: #1887e0; color: #fff; text-align: center; padding: 14px 0; border-radius: 4px; font-size: 17px; text-decoration: none; }
        
        /* 简易全屏水印：修改下面 svg 里的字即可 */
        .watermark-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='150'><text x='50%' y='50%' font-size='22' fill='rgba(200,200,200,0.3)' font-family='sans-serif' text-anchor='middle' dominant-baseline='middle' transform='rotate(-25, 110, 75)'>四川大学</text></svg>");
        }
    </style>
</head>
<body>
    <div class="watermark-bg"></div>
    
    <div class="header">2026年部分考生初试成绩查询</div>
    
    <div class="alert-box">
        招生单位说明：四川大学2026年硕士研究生招生有关事宜请关注研究生院官网。
    </div>

    <div class="info-list">
        <div class="info-item"><div class="info-label">姓名</div><div class="info-value">张璐</div></div>
        <div class="info-item"><div class="info-label">报名号</div><div class="info-value">360396135</div></div>
        <div class="info-item"><div class="info-label">准考证号</div><div class="info-value">104086135700368</div></div>
        <div class="info-item"><div class="info-label">总分</div><div class="info-value">339</div></div>
        <div class="info-item"><div class="info-label">第一门</div><div class="info-value">(101)思想政治理论：56</div></div>
        <div class="info-item"><div class="info-label">第二门</div><div class="info-value">(204)英语（二）：35</div></div>
        <div class="info-item"><div class="info-label">第三门</div><div class="info-value">(736)设计史论：123</div></div>
        <div class="info-item"><div class="info-label">第四门</div><div class="info-value">(902)设计基础（3小时）：125</div></div>
        <div class="info-item"><div class="info-label">备注</div><div class="info-value">无</div></div>
    </div>

    <div class="tips">
        本系统所有数据均为招生单位提供，招生单位对查询结果负责解释。<br><br>
        若查询的成绩为负值，表示有缺考、违纪等情况。若仍对查询结果有疑问，请咨询相应的招生单位。
    </div>

    <div class="btn-wrap">
        <a href="#" class="btn">返回</a>
    </div>
</body>
</html>
